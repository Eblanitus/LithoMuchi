[mod]
id = "litospherity"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "66f3981"

# --- Модуль runtime: наша генерация мира (не зависит от Horizon) ---
# Использует crates/litho-core как библиотеку, компилируется отдельно.
[[module]]
id = "runtime"
file = "crates/horizon-core/src/game.rs"
name = "litospherity"
source = "runtime.rs"

# --- Модуль bridge: клей к Horizon (знает типы игры) ---
# Компилируется только внутри игры Horizon.
[[module]]
id = "bridge"
file = "crates/horizon-core/src/game.rs"
name = "litospherity_bridge"
source = "bridge.rs"

# --- Точки входа (по образцу distant_horizons и коду Horizon 66f3981) ---

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "distance"
kind = "RETURN"
target = "horizon_client::game::Game<'_>::terrain_distance"
helper = "distance.rs"
bindings = [
  { name = "value", ty = "i32", value = "$value" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# --- Генерация чанков: хук native_fill (по коду Horizon 66f3981) ---
# TODO: проверить сигнатуру native_fill в коде Horizon версии 66f3981.
#       Привязки (bindings) могут потребовать корректировки.
[[injection]]
id = "fill"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_fill"
helper = "fill.rs"
bindings = [
  # Примерные привязки — уточнить по сигнатуре native_fill:
  # { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  # { name = "chunk_x", ty = "i32", value = "chunk_x" },
  # { name = "chunk_z", ty = "i32", value = "chunk_z" },
]
