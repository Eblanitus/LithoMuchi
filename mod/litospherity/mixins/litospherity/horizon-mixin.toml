[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[mod]
id = "litospherity"
priority = 100
version = "0.1.0"

[[module]]
file = "crates/horizon-client/src/game.rs"
id = "runtime"
name = "litospherity"
source = "runtime.rs"

[[injection]]
helper = "list.rs"
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"

[[injection.bindings]]
name = "mods"
ty = "&mut Vec<crate::game::native_hooks::NativeMod>"
value = "&mut *mods"

[[injection]]
helper = "register.rs"
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"

[[injection.bindings]]
name = "commands"
ty = "&mut Vec<crate::game::native_server::NativeCommand>"
value = "&mut *commands"

[[injection]]
helper = "command.rs"
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"

[[injection.bindings]]
name = "game"
ty = "&mut crate::game::Game<'_>"
value = "&mut *self"

[[injection.bindings]]
name = "command"
ty = "&str"
value = "command"

[[injection.bindings]]
name = "ran"
ty = "&mut bool"
value = "&mut *ran"

# T142-бис: тестовый маркер воды выше уровня моря (разведка, не фича).
[[injection]]
helper = "aquifer_marker.rs"
id = "aquifer_marker"
kind = "HEAD"
cancellable = true
target = "horizon_world::worldgen::aquifer::GlobalFluidPicker::compute"

[[injection.bindings]]
name = "this"
ty = "&GlobalFluidPicker"
value = "&*self"

[[injection.bindings]]
name = "position"
ty = "[i32; 3]"
value = "position"
