name: Проба точки · probe по координатам

# Диагностика координат из игровых тестов и issue без локального Rust:
# `litho-sandbox probe` в точке и вокруг неё, вывод — аннотациями задания.
# Так разбирается К8 (issue #7, «меза у льда», X 1287 Z 832; «плоская стена»,
# X −1797 Z −630) и любой следующий отчёт автора: нужен только сид, режим,
# версия и координаты.
#
# Запуск — как T151: правкой `tools/probe/request.json` и коммитом (push).
# `workflow_dispatch` заработает после вливания файла в `main`; до этого
# рабочая дорога — request.json, потому что вручную запускать можно только
# workflow, зарегистрированный на ветке по умолчанию.
#
# Замер приёмки не заменяет и гейтом не является: только поля и биомы.
on:
  push:
    branches: ["**"]
    paths:
      - "tools/probe/request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Проба полей в точке
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Сборка песочницы (release)
        run: cargo build --release -p litho-sandbox
      - name: Проба
        run: |
          python3 - <<'PY'
          import json, re, subprocess

          request = json.load(open("tools/probe/request.json", encoding="utf-8"))
          mode = request.get("mode", "gameplay")
          version = request.get("version", "v0")
          radius = float(request.get("radius", 64))
          step = float(request.get("step", 64))
          seeds = [str(s) for s in request.get("seeds", [42])]
          points = []
          for raw in request.get("at", ["1287,832"]):
              x, z = str(raw).split(",")
              points.append((float(x), float(z)))
          if request.get("note"):
              print(request["note"])
          print(f"режим {mode}, версия {version}, обход ±{radius:.0f} блоков шагом {step:.0f}, "
                f"точек {len(points)}, сидов {len(seeds)}")

          def field(text, pattern, default="?"):
              found = re.search(pattern, text)
              return found.group(1) if found else default

          def probe(seed, x, z):
              run = subprocess.run(
                  ["./target/release/litho-sandbox", "probe", "--seed", seed,
                   "--mode", mode, "--version", version, "--at", f"{x:.1f},{z:.1f}"],
                  capture_output=True, text=True)
              if run.returncode != 0:
                  tail = (run.stderr or run.stdout).strip().splitlines()
                  return f"ошибка: {tail[-1] if tail else 'код ' + str(run.returncode)}"
              text = run.stdout
              return ("биом={} зона={} T_bio={} T={} H={} φ={} океан={}".format(
                  field(text, r"биом=([^ ]+)"),
                  field(text, r"зона=([^ ]+)"),
                  field(text, r"T_bio=([-0-9.]+)"),
                  field(text, r"\bT=([-0-9.]+)"),
                  field(text, r"\bH=([-0-9.]+)"),
                  field(text, r"φ=([-0-9.]+)"),
                  field(text, r"океан=(\w+)"),
              ))

          offsets = [(0.0, 0.0)] if radius <= 0 else [
              (dx * radius, dz * radius)
              for dz in (-1.0, 0.0, 1.0) for dx in (-1.0, 0.0, 1.0)
          ]
          for seed in seeds:
              for x, z in points:
                  print(f"--- сид {seed}: точка ({x:.0f}, {z:.0f})")
                  for dx, dz in offsets:
                      px, pz = x + dx * step, z + dz * step
                      print(f"::notice::сид {seed} {mode} {version} ({px:.0f}, {pz:.0f}): "
                            f"{probe(seed, px, pz)}")
          PY
