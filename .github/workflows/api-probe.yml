# ВРЕМЕННО: печать реальных имён классов Minecraft 26.3 (удалить после правки Java).
name: api-probe
on:
  push:
    paths: ["fabric/build.gradle", ".github/workflows/api-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: Свежие версии Fabric для 26.3
        id: v
        run: |
          set -e
          mv=$(grep '^minecraft_version=' fabric/gradle.properties | cut -d= -f2)
          loader=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          api=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
                | grep -o "<version>[^<]*+${mv}</version>" | sed 's/<[^>]*>//g' | tail -1)
          loom=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml \
                | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -v -- '-' | tail -1 || true)
          args=""
          [ -n "$loader" ] && args="$args -Ploader_version=$loader"
          [ -n "$api" ] && args="$args -Pfabric_api_version=$api"
          [ -n "$loom" ] && args="$args -Ploom_version=$loom"
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Сигнатуры, короткий отчёт
        working-directory: fabric
        run: |
          set +e
          mkdir -p ../out
          gradle probeApi --console=plain ${{ steps.v.outputs.args }} > ../out/probe.log 2>&1
          jar=$(grep -oE "^PROBEJAR .*" ../out/probe.log | head -1 | sed 's/^PROBEJAR //')
          {
            echo "JAR $(basename "$jar")"
            echo "--- ResourceKey"
            javap -classpath "$jar" net.minecraft.resources.ResourceKey 2>&1 | grep -E "public" | head -20
            echo "--- LevelHeightAccessor"
            javap -classpath "$jar" net.minecraft.world.level.LevelHeightAccessor 2>&1 | grep -E "getMinY|getMaxY|getHeight" | head -6
          } | python3 ../tools/ci_annotations.py report || true
