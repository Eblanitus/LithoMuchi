name: CI

# План, T01 / 14.3: Linux + Windows msvc + Windows gnu, побитовые эталоны на
# всех трёх целях, проверка MSRV 1.85 (минимум workspace Horizon).
on:
  push:
    branches: ["**"]
    paths-ignore:
      # Документация CI не проверяет (PARAMS.md и карты собирает render.yml,
      # замеры T151 пишет t151.yml с [skip ci]); docs-only правки полный
      # прогон из 7 job'ов не запускают. См. BRANCH-ANALYSIS-2026-11-12, п. 7.
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

# На ветках новый push отменяет устаревший прогон: 33 запуска за день по
# 7 job'ов (2026-11-12) — дорого для бесплатных минут. На main прогоны не
# отменяются, а ждут очереди: там собирается артефакт для игровых тестов.
# Д-075: группа по имени ветки, а не по `github.ref`. У push это
# `refs/heads/<ветка>`, у pull_request — `refs/pull/N/merge`: с `github.ref`
# один и тот же коммит PR давал два полных прогона по 7 job'ов (PR #21 —
# 14 проверок). `head_ref`/`ref_name` сводят их в одну группу, более поздний
# прогон (pull_request) отменяет дубль. Префикс репозитория разделяет ветки
# с одинаковыми именами из форков. На main по-прежнему очередь, не отмена.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HORIZON_REV: 66f3981f522b24c250b21523a70080965b940424
  HORIZON_MIXINS_REV: 5a64af938ec86b00d53d16a408aabc0038fb3e57
  MCMETA_REV: 5f312935898c8f75f64d185b9874b129d0c67287
  LIBM_TAG: libm-v0.2.16

jobs:
  linux:
    name: Linux · fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "К1 — единые закрепления Horizon / mixins / 26.3"
        run: python3 tools/check_horizon_pins.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=json -- -D warnings | python3 tools/ci_annotations.py clippy
      - name: tests
        run: |
          set -o pipefail
          cargo test --workspace --exclude litho-tests --no-fail-fast 2>&1 | python3 tools/ci_annotations.py test
          # T115: случайные межплитовые инварианты строят много сетей стока;
          # проверяем их в release, чтобы debug-прогон не упёрся в бюджет T160.
          cargo test -p litho-tests --release --no-fail-fast 2>&1 | python3 tools/ci_annotations.py test
      - name: "ОБЯЗАТЕЛЬНЫЙ ГЕЙТ — seams пусто и бенч не хуже прошлого"
        run: |
          cargo run -p litho-sandbox --release -- seams --seed 42 --mode gameplay
          cargo run -p litho-sandbox --release -- bench --seed 42 --mode gameplay
          cargo run -p litho-sandbox --release -- stats --seed 42 --mode gameplay
      - name: "ЗАМОК v0 — хеши параметров не меняются"
        run: |
          cargo run -q -p litho-sandbox --release -- hash > /tmp/v0-hashes.txt
          cat /tmp/v0-hashes.txt
          grep -Fxq 'scientific = 5cdbe1d36ef8d16a' /tmp/v0-hashes.txt
          grep -Fxq 'gameplay = b48e8037c4e85977' /tmp/v0-hashes.txt
      - name: "К4 / шаг 6 — скорость v1-dev на колонку и на чанк"
        run: |
          target=$(python3 -c 'import json; print(json.load(open("tools/bench-targets.json"))["v1_dev_chunk_ms"])')
          enforce=()
          if [ "$(python3 -c 'import json; print(json.load(open("tools/bench-targets.json"))["enforce_in_ci"])')" = "True" ]; then
            enforce=(--enforce-chunk-target)
          fi
          # Д-059: вывод уходит в аннотацию прогона, чтобы нативную цифру можно
          # было прочитать без сырых логов.
          set -o pipefail
          cargo run -q -p litho-sandbox --release -- bench --seed 42 --mode gameplay --version v1-dev --chunk-target-ms "$target" "${enforce[@]}" | python3 tools/ci_annotations.py report
          cargo run -q -p litho-sandbox --release -- bench --seed 42 --mode scientific --version v1-dev --chunk-target-ms "$target" "${enforce[@]}" | python3 tools/ci_annotations.py report
      - name: "Д-059 — быстрый путь v1-dev против эталона (зона совпадает ≥ 0.97, как в 14.2)"
        run: |
          set -o pipefail
          cargo run -q -p litho-sandbox --release -- paths --seed 42 --mode gameplay --version v1-dev --center 2000,2000 --min-zone-share 0.97 | python3 tools/ci_annotations.py report
          cargo run -q -p litho-sandbox --release -- paths --seed 42 --mode scientific --version v1-dev --center 2000,2000 --min-zone-share 0.97 | python3 tools/ci_annotations.py report
      - name: "T79 — цена редких колонок дальнего рельефа (LOD), без гейта"
        run: |
          set -o pipefail
          # Horizon просит дальний рельеф тайлами 16 × 16 колонок с шагом
          # 4…128 блоков. Вторая строка каждого режима — тот же мир без
          # решётки высот луча (луч Д-059 с точной корой), для сравнения. Скорость
          # ванили здесь не меряется: ей нужны файлы игры.
          for mode in gameplay scientific; do
            cargo run -q -p litho-sandbox --release -- lod --seed 42 --mode "$mode" --version v1-dev --center 2000,2000 | python3 tools/ci_annotations.py report
            cargo run -q -p litho-sandbox --release -- lod --seed 42 --mode "$mode" --version v1-dev --center 2000,2000 --set boundaries.ray_field_l=0 | python3 tools/ci_annotations.py report
          done
      - name: "Э3.5 — v1-dev smoke (синтетика НЕ является приёмкой)"
        run: |
          set -o pipefail
          cargo run -q -p litho-sandbox --release -- stats --seed 42 --mode gameplay --version v1-dev --synthetic-height --span-l 16 --size 32 --relief-size 16 | python3 tools/ci_annotations.py report
          cargo run -q -p litho-sandbox --release -- render --seed 42 --mode gameplay --version v1-dev --layers vanilla-height --size 32 --bpp 32 --synthetic-height --out out/v1-dev-smoke
          cargo run -q -p xtask -- params-hash --version v1-dev | python3 tools/ci_annotations.py report
          for version in v0 v1-dev; do
            for mode in gameplay scientific; do
              # T115: до T160 широкий случайный скан v1-dev строит слишком
              # много холодных сетей. Локальный smoke не является приёмкой;
              # v0 остаётся на прежней области 200 L.
              span=()
              if [ "$version" = v1-dev ]; then span=(--span-l 16); fi
              cargo run -q -p litho-sandbox --release -- stats --seed 42 --mode "$mode" --version "$version" --synthetic-height --size 64 --relief-size 32 "${span[@]}" | python3 tools/ci_annotations.py report
            done
          done
          { echo "T100 synthetic sweep v1-dev local 16 L (НЕ приёмка, широкий скан после T160)"; cargo run -q -p litho-sandbox --release -- stats-all --version v1-dev --synthetic-height --span-l 16 --size 16 --relief-size 8 --boundary-size 8; } | python3 tools/ci_annotations.py report
      - name: "T151 — вердикт границ 10.1 и ориентиры 12.4 (объём малый, это НЕ приёмка)"
        run: |
          set -o pipefail
          # Полный объём 10.1 (16 сидов × 2 режима ≥200×200 L) в CI не считается.
          # Здесь проверяется сам путь вердикта и печатается NO-VOLUME.
          cargo run -q -p litho-sandbox --release -- acceptance --version v1-dev --seed 42 --mode gameplay --span-l 32 --size 32 --relief-size 8 --boundary-size 64 --boundary-step 32 | python3 tools/ci_annotations.py report
          cargo run -q -p litho-sandbox --release -- acceptance --version v1-dev --seeds 42,-42 --span-l 32 --size 32 --relief-size 8 --boundary-size 64 --boundary-step 32 --json | python3 tools/ci_annotations.py report
      - name: "Э3.5 — seams v1-dev gameplay (порог 0.02 не ослаблен)"
        run: |
          set -o pipefail
          cargo run -q -p litho-sandbox --release -- seams --seed 42 --mode gameplay --version v1-dev | python3 tools/ci_annotations.py report
      - name: "Э3.5 — seams v1-dev scientific (порог 0.02 не ослаблен)"
        run: |
          set -o pipefail
          cargo run -q -p litho-sandbox --release -- seams --seed 42 --mode scientific --version v1-dev | python3 tools/ci_annotations.py report
      - name: "Э3.5 — T110–T122 drainage/lakes/hydrology/relief smoke (R1 + галерейные леса + A/зоны)"
        run: |
          set -o pipefail
          LITHO_DRAINAGE_TIMINGS=1 cargo run -q -p litho-sandbox --release -- drainage --seed 42 --mode gameplay --version v1-dev --at 0,0 | python3 tools/ci_annotations.py report
          cargo run -q -p litho-sandbox --release -- render --seed 42 --mode gameplay --version v1-dev --layers channels,lakes,hydrology --size 32 --bpp 32 --out out/channels-smoke
          cargo run -q -p litho-sandbox --release -- render --seed 42 --mode gameplay --version v1-dev --layers channels,lakes,hydrology --center -54524.133387731,24107.233303404 --size 32 --bpp 32 --out out/lakes-delta-smoke
          # T120–T122: A/зоны переведены в C/E/W; малый кадр проверяет путь
          # relief + глубину впадин без широкого скана T160.
          cargo run -q -p litho-sandbox --release -- render --seed 42 --mode gameplay --version v1-dev --layers relief --size 8 --bpp 32 --out out/relief-smoke
      - name: Профиль скорости по слоям (Д-027, без подавления ошибок)
        run: cargo run -p litho-sandbox --release -- profile
      - name: sandbox smoke test
        run: cargo run -p litho-sandbox --release -- render --seed 42 --mode gameplay --layers plates,boundaries,jacobian --size 64 --out out/ci-smoke
      - name: "Э2 — шаблоны паков и бандла (без Windows-сборки)"
        run: |
          cargo run -q -p xtask -- pack --out /tmp/litho-packs
          cargo run -q -p xtask -- bundle --out /tmp/litho-bundle
          cargo run -q -p xtask -- bundle-check --out /tmp/litho-bundle

  msrv:
    name: Linux · MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      # +1.85.0 явно перекрывает rust-toolchain.toml (там канал stable).
      - name: litho-core на минимальной версии Rust
        run: cargo +1.85.0 check -p litho-core

  windows-msvc:
    name: Windows msvc · tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --exclude litho-tests --no-fail-fast 2>&1 | python tools/ci_annotations.py test
          cargo test -p litho-tests --release --no-fail-fast 2>&1 | python tools/ci_annotations.py test

  windows-gnu:
    name: Windows gnu (MinGW) · tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: tests
        shell: bash
        run: |
          set -o pipefail
          export PATH="/c/msys64/mingw64/bin:$PATH"
          cargo test --workspace --target x86_64-pc-windows-gnu --exclude litho-tests --no-fail-fast 2>&1 | python tools/ci_annotations.py test
          cargo test -p litho-tests --target x86_64-pc-windows-gnu --release --no-fail-fast 2>&1 | python tools/ci_annotations.py test

  horizon-core-contract:
    name: Horizon · реальный density core (ручная инъекция)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ env.HORIZON_REV }}
          path: .external/horizon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rust-lang/compiler-builtins
          ref: ${{ env.LIBM_TAG }}
          path: .external/compiler-builtins
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: "К1 — единые закрепления"
        run: python3 tools/check_horizon_pins.py
      - name: Собрать и проверить реальные типы Horizon (не launcher)
        run: tools/horizon-core-check/run.sh .external/horizon .external/compiler-builtins/libm

  horizon-mixins-contract:
    name: Horizon · настоящие mixins и граф 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ env.HORIZON_REV }}
          path: .external/horizon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: ${{ env.HORIZON_MIXINS_REV }}
          path: .external/horizon-mixins
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: misode/mcmeta
          ref: ${{ env.MCMETA_REV }}
          path: .external/mcmeta
          sparse-checkout: data/minecraft/worldgen/density_function/overworld
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: "К1 — единые закрепления"
        run: python3 tools/check_horizon_pins.py
      - name: Получить закреплённые зависимости и собрать transformer
        run: |
          cargo fetch --locked --manifest-path .external/horizon/Cargo.toml
          cargo fetch --locked --manifest-path .external/horizon-mixins/Cargo.toml
          cargo build --locked --manifest-path .external/horizon-mixins/Cargo.toml -p horizon-mixins-cli
      - name: Собрать настоящий hnmod и все паки
        run: |
          cargo run -q -p xtask -- bundle --out out/bundle
          cargo run -q -p xtask -- bundle-check --out out/bundle
          python3 tools/package_mod.py --bundle out/bundle --out out/release
          rm -rf out/native-check
          python3 -m zipfile -e out/release/litospherity.hnmod out/native-check
      - name: Материализовать документационную символьную ссылку Horizon
        # Pinned Horizon has CLAUDE.md -> AGENTS.md; mixins rejects symlinks.
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('.external/horizon').resolve()
          link = root / 'CLAUDE.md'
          if link.is_symlink():
              if link.resolve() != root / 'AGENTS.md':
                  raise SystemExit('Unexpected CLAUDE.md symlink target')
              content = link.read_bytes()
              link.unlink()
              link.write_bytes(content)
          PYTHON
      - name: Применить настоящий hnmod к закреплённым исходникам
        run: |
          if ! .external/horizon-mixins/target/debug/horizon-mixins apply \
            --workspace .external/horizon --mods out/native-check/mixins \
            --out /tmp/litho-horizon-staged-ci > /tmp/litho-mixin-apply.log 2>&1; then
            cat /tmp/litho-mixin-apply.log
            exit 1
          fi
          cat /tmp/litho-mixin-apply.log
      - name: Проверить настоящий внедрённый density graph
        run: |
          mkdir -p /tmp/litho-horizon-staged-ci/crates/horizon-core/tests
          cp tools/horizon-core-check/real_density.rs /tmp/litho-horizon-staged-ci/crates/horizon-core/tests/litho_real.rs
          if ! cargo test --locked --offline --manifest-path /tmp/litho-horizon-staged-ci/Cargo.toml \
            -p horizon-core --test litho_real > /tmp/litho-mixin-test.log 2>&1; then
            cat /tmp/litho-mixin-test.log
            exit 1
          fi
          cat /tmp/litho-mixin-test.log
      - name: "К2 — настоящие данные 26.3: depth = 0.375 + offset"
        run: |
          mkdir -p /tmp/litho-horizon-staged-ci/crates/horizon-world/tests
          cp tools/horizon-core-check/vanilla_26_3.rs /tmp/litho-horizon-staged-ci/crates/horizon-world/tests/litho_vanilla_26_3.rs
          export LITHO_PACKS="$GITHUB_WORKSPACE/out/bundle/packs"
          export LITHO_26_3_DATA="$GITHUB_WORKSPACE/.external/mcmeta"
          if ! cargo test --locked --offline --manifest-path /tmp/litho-horizon-staged-ci/Cargo.toml \
            -p horizon-world --test litho_vanilla_26_3 > /tmp/litho-world-test.log 2>&1; then
            cat /tmp/litho-world-test.log
            exit 1
          fi
          cat /tmp/litho-world-test.log

  hnmod:
    name: Мод · настоящий litospherity.hnmod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "К1 — единые закрепления"
        run: python3 tools/check_horizon_pins.py
      - name: Собрать бандл и проверить состав паков
        run: |
          cargo run -q -p xtask -- bundle --out out/bundle
          cargo run -q -p xtask -- bundle-check --out out/bundle
      - name: Упаковать клиентские хуки, ядро и все паки (v0 + v1-dev + smoke)
        run: python3 tools/package_mod.py --bundle out/bundle --out out/release
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ env.HORIZON_REV }}
          path: out/horizon-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: ${{ env.HORIZON_MIXINS_REV }}
          path: out/horizon-mixins
          persist-credentials: false
      - name: Материализовать документационную символьную ссылку Horizon
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('out/horizon-source').resolve()
          link = root / 'CLAUDE.md'
          if link.is_symlink():
              if link.resolve() != root / 'AGENTS.md':
                  raise SystemExit('Unexpected CLAUDE.md symlink target')
              content = link.read_bytes()
              link.unlink()
              link.write_bytes(content)
          PYTHON
      - name: Проверить настоящий план mixins
        run: |
          rm -rf out/native-check
          python3 -m zipfile -e out/release/litospherity.hnmod out/native-check
          cargo run --locked --manifest-path out/horizon-mixins/Cargo.toml -p horizon-mixins-cli -- plan --workspace out/horizon-source --mods out/native-check/mixins --out out/native-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: litospherity-hnmod
          path: |
            out/release/litospherity.hnmod
            out/release/*.zip
            out/native-plan.json
