# Ф1 (docs/PLAN-FABRIC.md): сборка и тесты litho-ffi под Windows, Linux, macOS.
name: ffi
on:
  push:
    paths: ["crates/litho-core/**", "crates/litho-ffi/**", ".github/workflows/ffi.yml"]
  pull_request:
    paths: ["crates/litho-core/**", "crates/litho-ffi/**", ".github/workflows/ffi.yml"]
concurrency:
  group: ffi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, lib: litho_ffi.dll }
          - { os: ubuntu-latest, lib: liblitho_ffi.so }
          - { os: macos-latest, lib: liblitho_ffi.dylib }
          - { os: macos-13, lib: liblitho_ffi.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p litho-ffi --release
      - run: cargo build -p litho-ffi --release
      - uses: actions/upload-artifact@v4
        with:
          name: litho-ffi-${{ matrix.os }}
          path: target/release/${{ matrix.lib }}
