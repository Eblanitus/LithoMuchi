# Временный диагностический прогон ветки arena/4e4f066f-lithomuchi: в песочнице
# нет Rust, а логи job'ов отсюда не скачиваются. Ошибки печатаются
# workflow-командами `::error::` и читаются через annotations API.
name: diag
on:
  push:
    paths:
      - ".diag-trigger"
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: |
          set +e
          cargo fmt --all --check > /tmp/fmt.log 2>&1
          status=$?
          grep -E "^Diff in" /tmp/fmt.log | head -20 | sed 's/^/::error::fmt /'
          if [ $status -ne 0 ]; then head -c 1500 /tmp/fmt.log; fi
          exit $status
      - name: clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          status=$?
          grep -E "^(error|warning)" /tmp/clippy.log | head -24 | sed 's/^/::error::clippy /'
          if [ $status -ne 0 ]; then grep -A3 -E "^error" /tmp/clippy.log | head -80; fi
          exit $status
      - name: tests
        run: |
          set +e
          cargo test --workspace > /tmp/test.log 2>&1
          status=$?
          grep -E "panicked at|^error\[|^error:|^---- " /tmp/test.log | head -24 | sed 's/^/::error::test /'
          if [ $status -ne 0 ]; then grep -B2 -A12 -E "panicked at" /tmp/test.log | head -120; fi
          exit $status
