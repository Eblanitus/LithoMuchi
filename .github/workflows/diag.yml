# Временный диагностический прогон ветки arena/4e4f066f-lithomuchi: в песочнице
# нет Rust, а логи job'ов отсюда не скачиваются. Поэтому логи складываются в
# каталог `diag/` и коммитятся в саму ветку — оттуда их читает агент.
name: diag
on:
  push:
    paths:
      - ".diag-trigger"
    branches:
      - "arena/4e4f066f-lithomuchi"
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        continue-on-error: true
        run: cargo fmt --all --check > diag/fmt.log 2>&1 || true
      - name: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings > diag/clippy.log 2>&1 || true
      - name: build tests
        continue-on-error: true
        run: cargo test --workspace --no-run > diag/build.log 2>&1 || true
      - name: tests
        continue-on-error: true
        run: cargo test --workspace --no-fail-fast > diag/test.log 2>&1 || true
      - name: hashes
        continue-on-error: true
        run: |
          : > diag/hash.log
          for version in v0 v1 v1-dev v1-dev-r2 v1-dev-w; do
            echo "== $version" >> diag/hash.log
            cargo run -q -p xtask -- params-hash --version "$version" >> diag/hash.log 2>&1 || echo "ОШИБКА $version" >> diag/hash.log
          done
      - name: water-leaks
        continue-on-error: true
        run: |
          : > diag/leaks.log
          for mode in gameplay scientific; do
            for seed in 42 7; do
              echo "== $mode $seed" >> diag/leaks.log
              cargo run -q -p litho-sandbox --release -- water-leaks --seed "$seed" --mode "$mode" --version v1-dev-r2 --size 1024 --step 8 >> diag/leaks.log 2>&1 || echo "ОШИБКА $mode $seed" >> diag/leaks.log
            done
          done
      - name: water-stats baseline
        continue-on-error: true
        run: |
          : > diag/water-stats.log
          for mode in gameplay scientific; do
            for seed in 42 7; do
              echo "== $mode $seed" >> diag/water-stats.log
              cargo run -q -p litho-sandbox --release -- water-stats "$seed" "$mode" --version v1-dev-r2 --window 1024 --step 16 >> diag/water-stats.log 2>&1 || echo "ОШИБКА $mode $seed" >> diag/water-stats.log
            done
          done
      - name: commit logs
        if: always()
        run: |
          mkdir -p diag
          for f in diag/*.log; do
            head -c 400000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diag
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: логи fmt/clippy/tests"
          git push
