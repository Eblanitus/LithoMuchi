name: fmt-and-clippy-report
# ВРЕМЕННЫЙ workflow: в среде разработки нет rustfmt/clippy, а логи job'ов
# недоступны, поэтому дифф форматирования и ошибки clippy отдаются аннотациями
# (api.github.com). Удаляется после правки.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fmt-and-clippy-report.yml"]
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt diff как аннотация
        run: |
          cargo fmt --all
          python3 - <<'PY'
          import subprocess, urllib.parse
          diff = subprocess.run(["git", "diff"], capture_output=True, text=True).stdout
          if not diff:
              print("::notice::rustfmt: диффа нет")
              raise SystemExit(0)
          body = urllib.parse.quote(diff[:60000], safe="")
          print(f"::error::FMTDIFF {body}")
          PY
      - name: clippy как аннотация
        run: |
          python3 - <<'PY'
          import subprocess, urllib.parse
          out = subprocess.run(
              ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"],
              capture_output=True, text=True)
          text = out.stdout + out.stderr
          lines = [l for l in text.splitlines() if l.startswith(("error", "warning"))]
          if not lines:
              print("::notice::clippy: чисто")
              raise SystemExit(0)
          body = urllib.parse.quote("\n".join(lines[:300])[:60000], safe="")
          print(f"::error::CLIPPY {body}")
          PY
