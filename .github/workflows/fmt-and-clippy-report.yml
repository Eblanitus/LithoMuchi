name: fmt-and-clippy-report
# ВРЕМЕННЫЙ workflow (идет отладка): в среде разработки нет rustfmt/clippy, а
# логи job'ов недоступны, поэтому дифф форматирования и ошибки clippy отдаются
# аннотациями (api.github.com) кусками по 1200 символов. Удаляется после правки.
on:
  workflow_dispatch:
  push:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt diff как аннотации
        run: |
          cargo fmt --all
          python3 - <<'PY'
          import subprocess, urllib.parse
          diff = subprocess.run(["git", "diff"], capture_output=True, text=True).stdout
          if not diff:
              print("::notice::rustfmt: диффа нет")
              raise SystemExit(0)
          enc = urllib.parse.quote(diff, safe="")
          step = 1200
          for i in range(0, min(len(enc), step * 40), step):
              print(f"::error::FMTDIFF{i // step}:{enc[i:i + step]}")
          PY
      - name: clippy как аннотации
        run: |
          python3 - <<'PY'
          import subprocess, urllib.parse
          out = subprocess.run(
              ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"],
              capture_output=True, text=True)
          text = out.stdout + out.stderr
          lines = [l for l in text.splitlines() if l.startswith(("error", "warning"))]
          if not lines:
              print("::notice::clippy: чисто")
              raise SystemExit(0)
          enc = urllib.parse.quote("\n".join(lines[:300]), safe="")
          step = 1200
          for i in range(0, min(len(enc), step * 20), step):
              print(f"::error::CLIPPY{i // step}:{enc[i:i + step]}")
          PY
