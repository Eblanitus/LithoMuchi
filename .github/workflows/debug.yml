# ВРЕМЕННЫЙ workflow: диагностика сборки и перерисовка карт после Э1f.
name: Debug build
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Проверить сборку
        run: |
          cargo test --workspace > /tmp/test.txt 2>&1 || true
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.txt 2>&1 || true
          python3 - <<'PY'
          import re
          for label, name in [('TEST', 'test'), ('CLIPPY', 'clippy')]:
              text = open(f'/tmp/{name}.txt', encoding='utf-8', errors='replace').read()
              text = re.sub(r'\x1b\[[0-9;]*m', '', text)[:55000]
              esc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{label}: ' + esc)
          PY
      - name: Таблица параметров
        run: cargo run -p xtask --release -- params-doc > docs/PARAMS.md
      - name: Перерисовать карты
        run: |
          cargo run -p litho-sandbox --release -- render \
            --seed 42 --mode gameplay --size 512 --bpp 64 \
            --layers noise,warp,plates,boundaries,jacobian,hash,crust,height,mpi \
            --out docs/images/v0-seed42-gameplay
          cargo run -p litho-sandbox --release -- render \
            --seed 42 --mode gameplay --size 256 --bpp 128 \
            --layers poles,temp,wind,moisture,precip,zones,biomes,vanilla \
            --out docs/images/v0-seed42-gameplay
          cargo run -p litho-sandbox --release -- render \
            --seed 42 --mode gameplay --size 128 --bpp 256 \
            --layers rivers,lava,spawn \
            --out docs/images/v0-seed42-gameplay
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add docs/images/v0-seed42-gameplay docs/PARAMS.md
          git diff --cached --quiet || git commit -m "Карты и параметры после Э1f [skip ci]"
          git push origin HEAD:arena/f957ca43-lithomuchi || true
