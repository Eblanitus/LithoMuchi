# ВРЕМЕННЫЙ диагностический workflow: в этой песочнице недоступен хост,
# с которого gh скачивает логи Actions. Вывод сборки публикуется как
# annotation чек-рана и читается через api.github.com. Удалить после отладки.
name: Debug build

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Собрать вывод тестов и clippy
        run: |
          cargo test --workspace > /tmp/test.txt 2>&1 || true
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.txt 2>&1 || true
          cargo fmt --all -- --check > /tmp/fmt.txt 2>&1 || true
          python3 - <<'PY'
          import re
          for label, name in [('TEST', 'test'), ('CLIPPY', 'clippy'), ('FMT', 'fmt')]:
              text = open(f'/tmp/{name}.txt', encoding='utf-8', errors='replace').read()
              text = re.sub(r'\x1b\[[0-9;]*m', '', text)[:55000]
              esc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{label}: ' + esc)
          PY
