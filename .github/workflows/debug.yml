# ВРЕМЕННЫЙ workflow: в этой песочнице нет компилятора Rust и недоступен хост
# выдачи логов/артефактов Actions. Он (1) публикует вывод сборки как
# annotations, (2) рендерит карты песочницы и кладёт их в docs/images.
# Удалить после того, как картинки получены и CI зелёный.
name: Debug build

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Проверить сборку
        run: |
          cargo test --workspace > /tmp/test.txt 2>&1 || true
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.txt 2>&1 || true
          python3 - <<'PY'
          import re
          for label, name in [('TEST', 'test'), ('CLIPPY', 'clippy')]:
              text = open(f'/tmp/{name}.txt', encoding='utf-8', errors='replace').read()
              text = re.sub(r'\x1b\[[0-9;]*m', '', text)[:55000]
              esc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{label}: ' + esc)
          PY
      - name: Карты песочницы для автора
        run: |
          cargo run -p litho-sandbox --release -- render \
            --seed 42 --mode gameplay --size 512 --bpp 64 \
            --layers plates,boundaries,jacobian,noise \
            --out docs/images/v0-seed42-gameplay
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add docs/images/v0-seed42-gameplay
          git diff --cached --quiet || git commit -m "Карты песочницы v0: сид 42, геймплейный режим"
          git push origin HEAD:arena/f957ca43-lithomuchi || true
