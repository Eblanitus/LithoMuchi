name: Применить патч из tools/patches

on:
  push:
    branches-ignore:
      - main
    paths:
      - "tools/patches/incoming.patch.gz.b64"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Применить и сохранить правки
        run: |
          base64 -d tools/patches/incoming.patch.gz.b64 | gunzip > /tmp/incoming.patch
          git apply --check /tmp/incoming.patch
          git apply /tmp/incoming.patch
          MSG="Применить патч"
          if [ -f tools/patches/commit-message.txt ]; then
            MSG="$(cat tools/patches/commit-message.txt)"
            git rm -f tools/patches/commit-message.txt
          fi
          git rm -f tools/patches/incoming.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$MSG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
