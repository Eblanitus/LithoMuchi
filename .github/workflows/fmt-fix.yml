# Временный помощник ветки arena/4e4f066f-lithomuchi: в песочнице нет Rust,
# поэтому форматирование применяет CI. Запуск — пуш файла `.fmt-trigger`.
# Файл и триггер удаляются следующим коммитом.
name: fmt-fix
on:
  push:
    paths:
      - ".fmt-trigger"
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all
      - name: commit and push if changed
        run: |
          if git diff --quiet; then
            echo "форматирование уже верное"
            exit 0
          fi
          git config user.name "fmt-bot"
          git config user.email "fmt-bot@users.noreply.github.com"
          git add -A
          git commit -m "rustfmt: форматирование ВО0-1/ВО0-2 (CI)"
          git push
